<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wykresy</title>
<meta name="theme-color" content="#eef1fb">
<style>
:root{
  --bg:#eef1fb; --text:#1d1d1f; --muted:rgba(60,60,67,.62); --accent:#0a84ff;
  --glass:linear-gradient(135deg,rgba(255,255,255,.62),rgba(255,255,255,.26));
  --glass-bd:rgba(255,255,255,.75); --glass-in:rgba(255,255,255,.9);
  --shadow:0 18px 50px rgba(40,50,140,.16),0 2px 8px rgba(40,50,140,.06);
  --field:rgba(255,255,255,.55); --field-bd:rgba(60,60,67,.12); --blob:.6;
}
[data-theme=dark]{
  --bg:#0b0c15; --text:#f5f5f7; --muted:rgba(235,235,245,.6);
  --glass:linear-gradient(135deg,rgba(255,255,255,.15),rgba(255,255,255,.05));
  --glass-bd:rgba(255,255,255,.2); --glass-in:rgba(255,255,255,.28);
  --shadow:0 18px 50px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.3);
  --field:rgba(255,255,255,.08); --field-bd:rgba(255,255,255,.12); --blob:.5;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:light dark}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);
  font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;transition:background .5s,color .3s}
button,input{font:inherit;color:inherit}
button{cursor:pointer}

/* tło */
.bg{position:fixed;inset:0;overflow:hidden;z-index:-1}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:var(--blob);animation:float 24s ease-in-out infinite alternate}
.b1{width:46vmax;height:46vmax;left:-12vmax;top:-14vmax;background:#4c8dff}
.b2{width:40vmax;height:40vmax;right:-10vmax;top:6vmax;background:#c35cff;animation-delay:-6s}
.b3{width:44vmax;height:44vmax;left:18vmax;bottom:-24vmax;background:#ff5d7d;animation-delay:-12s}
.b4{width:28vmax;height:28vmax;right:8vmax;bottom:-8vmax;background:#ffb340;animation-delay:-3s}
@keyframes float{to{transform:translate3d(6vmax,4vmax,0) scale(1.15)}}

/* Liquid Glass */
.glass{position:relative;isolation:isolate;background:var(--glass);
  -webkit-backdrop-filter:blur(30px) saturate(190%) brightness(1.04);backdrop-filter:blur(30px) saturate(190%) brightness(1.04);
  border:1px solid var(--glass-bd);border-radius:30px;
  box-shadow:var(--shadow),inset 0 1.5px 0 var(--glass-in),inset 0 -1px 0 rgba(255,255,255,.12),inset 1px 0 0 rgba(255,255,255,.18),inset -1px 0 0 rgba(255,255,255,.1)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;pointer-events:none;
  background:radial-gradient(420px circle at var(--mx,25%) var(--my,0%),rgba(255,255,255,.38),transparent 45%);opacity:.7}
[data-theme=dark] .glass::before{opacity:.35}

.wrap{max-width:1280px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 18px 40px}
header{display:flex;align-items:center;gap:12px;padding:6px 4px 18px}
.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:var(--accent)}
.logo svg{width:24px;height:24px}
h1{font-size:26px;letter-spacing:-.02em;margin:0;font-weight:700}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 16px;border-radius:999px;
  border:1px solid var(--glass-bd);background:var(--glass);font-weight:600;font-size:14px;
  -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  box-shadow:inset 0 1px 0 var(--glass-in),0 4px 14px rgba(30,40,120,.1);
  transition:transform .35s cubic-bezier(.34,1.56,.64,1),background .2s,opacity .2s}
.btn:hover{transform:scale(1.04)}.btn:active{transform:scale(.95)}
.btn.icon{width:40px;padding:0}
.btn.primary{background:linear-gradient(180deg,#3d9bff,#0a7aff);color:#fff;border-color:rgba(255,255,255,.4)}
.btn:disabled{opacity:.35;pointer-events:none}
.btn svg{width:18px;height:18px;flex:none}
svg.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

main{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:20px;align-items:start}
@media(max-width:1020px){main{grid-template-columns:minmax(0,1fr)}}

.chart-card{padding:16px 18px 14px}
.seg{position:relative;overflow-x:auto;scrollbar-width:none;border-radius:999px;margin-bottom:6px}
.seg::-webkit-scrollbar{display:none}
.seg-in{position:relative;display:inline-flex;gap:2px;padding:4px;min-width:100%;border-radius:999px;
  background:var(--field);border:1px solid var(--field-bd);box-shadow:inset 0 1px 3px rgba(0,0,0,.06)}
.seg-in button{position:relative;z-index:1;flex:1 0 auto;display:flex;align-items:center;justify-content:center;gap:7px;
  height:38px;padding:0 14px;border:0;background:none;border-radius:999px;font-weight:600;font-size:13.5px;color:var(--muted);
  transition:color .25s;white-space:nowrap}
.seg-in button.on{color:var(--text)}
.seg-in button svg{width:18px;height:18px}
.thumb{position:absolute;z-index:0;top:4px;bottom:4px;left:0;border-radius:999px;
  background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,.7));
  box-shadow:0 3px 12px rgba(30,40,120,.2),inset 0 1px 0 #fff;transition:transform .45s cubic-bezier(.34,1.3,.64,1),width .45s cubic-bezier(.34,1.3,.64,1)}
[data-theme=dark] .thumb{background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,.14));box-shadow:0 3px 12px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.35)}

.stage{position:relative;touch-action:pan-y}
#chart{display:block;width:100%;user-select:none;-webkit-user-select:none;overflow:visible}
body.dragging,body.dragging *{cursor:grabbing!important;user-select:none}
#chart [data-drag]{cursor:ns-resize;transition:filter .2s}
#chart [data-drag="pie"],#chart [data-drag="rad"]{cursor:grab}
#chart [data-drag]:hover{filter:brightness(1.08)}
#chart .hnd{opacity:0;transition:opacity .2s,r .2s}
#chart:hover .hnd,body.dragging .hnd{opacity:1}
@media(hover:none){#chart .hnd{opacity:.9}}
#chart .pt{transition:r .2s}
#chart .hitc:hover+.pt,#chart .pt:hover{r:8}
#chart .lg{cursor:pointer;transition:opacity .2s}
#chart .slice{transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
#chart .slice:hover{transform:translate(var(--dx),var(--dy))}
.enter .bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow .8s cubic-bezier(.2,.9,.25,1) both;animation-delay:calc(var(--k,0)*35ms)}
.enter .draw{stroke-dasharray:1;animation:draw 1.1s ease both}
.enter .fade,.enter .slice{animation:fade .8s ease both;animation-delay:calc(var(--k,0)*60ms)}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0}}
.tip{position:absolute;pointer-events:none;z-index:5;padding:7px 12px;border-radius:12px;font-size:13px;font-weight:600;white-space:nowrap;
  opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s;
  background:var(--glass);border:1px solid var(--glass-bd);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  box-shadow:0 8px 24px rgba(0,0,0,.18),inset 0 1px 0 var(--glass-in)}
.tip.on{opacity:1;transform:none}
.hint{margin:4px 6px 0;color:var(--muted);font-size:12.5px;text-align:center}

aside{display:flex;flex-direction:column;gap:20px}
.panel{padding:18px}
.panel h2{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.field{width:100%;height:40px;padding:0 14px;border-radius:14px;border:1px solid var(--field-bd);background:var(--field);outline:none;transition:box-shadow .2s,border-color .2s}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(10,132,255,.2)}
.tbl-wrap{max-height:340px;overflow:auto;margin:0 -6px;padding:0 6px;scrollbar-width:thin}
table{width:100%;border-collapse:separate;border-spacing:0 6px}
th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:0 0 2px;position:sticky;top:0;z-index:2}
td{padding:0 4px 0 0}
td:last-child,th:last-child{width:30px;padding:0}
table .field{height:36px;border-radius:11px;padding:0 10px;font-size:14px;min-width:0}
table input[type=number]{text-align:right;width:84px;font-variant-numeric:tabular-nums}
.sh,.lb{display:flex;align-items:center;gap:6px}
.sh .field{font-weight:600;height:32px;font-size:13px}
input[type=color]{-webkit-appearance:none;appearance:none;flex:none;width:24px;height:24px;padding:0;border:2px solid #fff;border-radius:50%;
  background:none;cursor:pointer;box-shadow:0 1px 5px rgba(0,0,0,.28)}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:0;border-radius:50%}
input[type=color]::-moz-color-swatch{border:0;border-radius:50%}
.x{width:26px;height:26px;border-radius:50%;border:0;background:rgba(255,59,48,.14);color:#ff453a;font-size:16px;line-height:1;display:grid;place-items:center;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.x:hover{transform:scale(1.15)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row .btn{height:36px;font-size:13px;padding:0 13px}
.sw{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--field-bd)}
.sw:last-child{border:0}
.sw input{-webkit-appearance:none;appearance:none;position:relative;width:51px;height:31px;border-radius:999px;background:rgba(120,120,128,.32);border:0;cursor:pointer;transition:background .3s;flex:none}
.sw input::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.sw input:checked{background:#30d158}
.sw input:checked::after{transform:translateX(20px)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--field-bd);background:var(--field);font-size:13px;font-weight:600;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.chip:hover{transform:scale(1.06)}.chip:active{transform:scale(.95)}
</style>
</head>
<body>
<div class="bg"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><i class="blob b4"></i></div>

<div class="wrap">
  <header>
    <div class="logo glass" style="border-radius:14px"><svg class="i" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg></div>
    <h1>Wykresy</h1>
    <div class="sp"></div>
    <button class="btn icon" id="undo" title="Cofnij (Ctrl/⌘+Z)" aria-label="Cofnij"><svg class="i" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button class="btn icon" id="redo" title="Ponów (Ctrl/⌘+Shift+Z)" aria-label="Ponów"><svg class="i" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    <button class="btn icon" id="theme" title="Motyw" aria-label="Zmień motyw"><svg class="i" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  </header>

  <main>
    <section class="chart-card glass">
      <div class="seg"><div class="seg-in" id="seg"><i class="thumb" id="thumb"></i></div></div>
      <div class="stage" id="stage">
        <svg id="chart" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Wykres"></svg>
        <div class="tip" id="tip"></div>
      </div>
      <p class="hint">Przeciągaj słupki, punkty i krawędzie wycinków, aby zmieniać dane. Kliknij legendę, aby ukryć serię.</p>
    </section>

    <aside>
      <div class="panel glass">
        <h2>Tytuł</h2>
        <input class="field" id="title" maxlength="80" placeholder="Tytuł wykresu" autocomplete="off">
      </div>
      <div class="panel glass">
        <h2>Dane</h2>
        <div class="tbl-wrap" id="tbl"></div>
        <div class="row">
          <button class="btn" id="addRow"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Wiersz</button>
          <button class="btn" id="addSer"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Seria</button>
          <button class="btn" id="rand"><svg class="i" viewBox="0 0 24 24"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>Losuj</button>
        </div>
      </div>
      <div class="panel glass">
        <h2>Wygląd</h2>
        <label class="sw">Wartości na wykresie<input type="checkbox" data-opt="values"></label>
        <label class="sw">Legenda<input type="checkbox" data-opt="legend"></label>
        <label class="sw">Siatka<input type="checkbox" data-opt="grid"></label>
        <label class="sw">Gładkie linie<input type="checkbox" data-opt="smooth"></label>
      </div>
      <div class="panel glass">
        <h2>Przykłady</h2>
        <div class="chips" id="presets"></div>
      </div>
      <div class="panel glass">
        <h2>Eksport</h2>
        <div class="row" style="margin-top:0">
          <button class="btn primary" id="png"><svg class="i" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>PNG</button>
          <button class="btn" id="svgx"><svg class="i" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>SVG</button>
        </div>
      </div>
    </aside>
  </main>
</div>

<script>
"use strict";
const $=s=>document.querySelector(s);
const svg=$('#chart'), tip=$('#tip');
const PAL=['#0a84ff','#ff375f','#30d158','#ff9f0a','#bf5af2','#64d2ff','#ffd60a','#ac8e68'];
const FONT="-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif";
const TYPES=[
 {id:'bar',name:'Słupkowy',ic:'<path d="M5 20v-9M12 20V4M19 20v-6" stroke-width="3"/>'},
 {id:'stacked',name:'Skumulowany',ic:'<path d="M7 20v-5M7 12v-3M17 20v-8M17 9V5" stroke-width="3"/>'},
 {id:'line',name:'Liniowy',ic:'<path d="M3 17l5-6 4 3 8-9"/>'},
 {id:'area',name:'Warstwowy',ic:'<path d="M3 18l5-6 4 3 8-8v11z"/>'},
 {id:'pie',name:'Kołowy',ic:'<path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/>'},
 {id:'donut',name:'Pierścieniowy',ic:'<circle cx="12" cy="12" r="7.5" stroke-dasharray="30 17" stroke-width="4"/>'},
 {id:'radar',name:'Radarowy',ic:'<path d="M12 3l8 6-3 10H7L4 9z"/><path d="M12 8l4 3-1.5 5h-5L8 11z"/>'}
];
const MONTHS=['sty','lut','mar','kwi','maj','cze','lip','sie','wrz','paź','lis','gru'];
const PRESETS={
 'Sprzedaż':{type:'bar',title:'Sprzedaż kwartalna (tys. zł)',labels:['Q1','Q2','Q3','Q4'],series:[{name:'2025',color:PAL[0],values:[42,58,65,80]},{name:'2026',color:PAL[1],values:[55,70,62,96]}]},
 'Budżet':{type:'donut',title:'Budżet domowy (zł)',labels:['Mieszkanie','Jedzenie','Transport','Rozrywka','Oszczędności'],series:[{name:'PLN',color:PAL[0],values:[2400,1300,600,450,750]}]},
 'Temperatura':{type:'line',title:'Średnia temperatura (°C)',labels:MONTHS,series:[{name:'Warszawa',color:PAL[3],values:[-1,0,4,10,15,19,21,20,15,9,4,0]},{name:'Zakopane',color:PAL[0],values:[-4,-3,1,6,11,15,17,17,12,7,1,-3]}]},
 'Umiejętności':{type:'radar',title:'Profil umiejętności',labels:['Design','Kod','Komunikacja','Analiza','Kreatywność','Zarządzanie'],series:[{name:'Anna',color:PAL[4],values:[85,60,90,70,95,55]},{name:'Marek',color:PAL[2],values:[50,92,60,88,55,75]}]},
 'Ruch w sieci':{type:'area',title:'Odwiedziny strony',labels:['Pn','Wt','Śr','Cz','Pt','So','Nd'],series:[{name:'Mobile',color:PAL[5],values:[320,410,380,520,610,450,300]},{name:'Desktop',color:PAL[4],values:[540,600,580,640,520,260,200]}]}
};
let S=null, W=800, H=520, ph=300, lastSc=null, frozen=null, drag=null, geo={};
const P={l:60,r:28,t:76,b:80};
const isPie=()=>S.type==='pie'||S.type==='donut';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cut=(s,n)=>s.length>n?s.slice(0,n-1)+'…':s;
const nf=new Intl.NumberFormat('pl-PL',{maximumFractionDigits:2});
const nfc=new Intl.NumberFormat('pl-PL',{notation:'compact',maximumFractionDigits:1});
const fmt=v=>Math.abs(v)>=10000?nfc.format(v):nf.format(v);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));

function mkState(p){
  return {title:p.title,type:p.type,labels:[...p.labels],series:p.series.map(s=>({name:s.name,color:s.color,values:[...s.values]})),
    catColors:p.labels.map((_,i)=>PAL[i%PAL.length]),hiddenS:[],hiddenC:[],
    opts:{values:true,legend:true,grid:true,smooth:true}};
}
const isDark=()=>document.documentElement.dataset.theme==='dark';
const theme=()=>isDark()?{text:'#f5f5f7',muted:'rgba(235,235,245,.62)',grid:'rgba(255,255,255,.12)',edge:'rgba(255,255,255,.5)',bg:'#12131d'}
                         :{text:'#1d1d1f',muted:'rgba(60,60,67,.62)',grid:'rgba(60,60,67,.13)',edge:'rgba(255,255,255,.9)',bg:'#f1f4fc'};

/* ---------- skale ---------- */
function nice(min,max,n=5){
  if(max<=min)max=min+1;
  const raw=(max-min)/n,p=10**Math.floor(Math.log10(raw)),f=raw/p;
  const step=(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;
  return {min:+(Math.floor(min/step+1e-9)*step).toFixed(10),max:+(Math.ceil(max/step-1e-9)*step).toFixed(10),step};
}
const visS=()=>S.series.map((s,i)=>({s,i})).filter(o=>!S.hiddenS.includes(o.i));
function scaleFor(vs){
  let hi=0,lo=0;
  if(S.type==='stacked'){
    S.labels.forEach((_,i)=>{const t=vs.reduce((a,o)=>a+Math.max(0,o.s.values[i]||0),0);hi=Math.max(hi,t)});
  }else vs.forEach(o=>o.s.values.forEach(v=>{hi=Math.max(hi,v||0);lo=Math.min(lo,v||0)}));
  return nice(lo<0?lo*1.1:0,hi>0?hi*1.08:1);
}
function pathMono(p){
  const n=p.length; if(n<2)return n?`M${p[0][0]},${p[0][1]}`:'';
  const dx=[],m=[],t=[];
  for(let i=0;i<n-1;i++){dx[i]=p[i+1][0]-p[i][0];m[i]=(p[i+1][1]-p[i][1])/dx[i]}
  t[0]=m[0];t[n-1]=m[n-2];
  for(let i=1;i<n-1;i++)t[i]=m[i-1]*m[i]<=0?0:(m[i-1]+m[i])/2;
  for(let i=0;i<n-1;i++){
    if(m[i]===0){t[i]=t[i+1]=0;continue}
    const a=t[i]/m[i],b=t[i+1]/m[i],s=a*a+b*b;
    if(s>9){const k=3/Math.sqrt(s);t[i]=k*a*m[i];t[i+1]=k*b*m[i]}
  }
  let d=`M${p[0][0]},${p[0][1]}`;
  for(let i=0;i<n-1;i++)d+=`C${p[i][0]+dx[i]/3},${p[i][1]+t[i]*dx[i]/3} ${p[i+1][0]-dx[i]/3},${p[i+1][1]-t[i+1]*dx[i]/3} ${p[i+1][0]},${p[i+1][1]}`;
  return d;
}
const pathLine=p=>p.map((q,i)=>(i?'L':'M')+q[0]+','+q[1]).join('');

/* ---------- legenda ---------- */
function legend(T){
  if(!S.opts.legend)return {html:'',h:0};
  const items=isPie()?S.labels.map((l,i)=>({k:'c',i,name:l,c:S.catColors[i],off:S.hiddenC.includes(i)}))
                     :S.series.map((s,i)=>({k:'s',i,name:s.name,c:s.color,off:S.hiddenS.includes(i)}));
  const rows=[[]],widths=[0],maxW=W-40;
  items.forEach(it=>{
    it.w=26+Math.min(it.name.length,16)*6.9+14;
    let r=rows.length-1;
    if(widths[r]+it.w>maxW&&rows[r].length){rows.push([]);widths.push(0);r++}
    rows[r].push(it);widths[r]+=it.w;
  });
  const h=rows.length*24;
  let html='';
  rows.forEach((row,r)=>{
    let x=(W-widths[r])/2+7;const y=H-h+r*24+4;
    row.forEach(it=>{
      html+=`<g class="lg" data-lg="${it.k}" data-i="${it.i}" opacity="${it.off?.35:1}">
        <rect x="${x-8}" y="${y-12}" width="${it.w-4}" height="24" fill="transparent"/>
        <circle cx="${x}" cy="${y}" r="5.5" fill="${it.c}"/>
        <text x="${x+12}" y="${y+4.5}" font-size="13" fill="${T.muted}" text-decoration="${it.off?'line-through':'none'}">${esc(cut(it.name,16))}</text></g>`;
      x+=it.w;
    });
  });
  return {html,h:h+8};
}

/* ---------- render ---------- */
function render(animate){
  const T=theme();
  W=Math.round(clamp(svg.parentElement.clientWidth||800,300,1200));
  H=Math.round(clamp(W*.66,390,640));
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.setAttribute('height',H);
  const lg=legend(T);
  P.l=W<520?44:60;P.r=W<520?16:28;P.t=72;P.b=34+lg.h;
  ph=H-P.t-P.b;
  const title=`<text x="${W<520?8:12}" y="38" font-size="${W<520?19:24}" font-weight="700" fill="${T.text}" letter-spacing="-.4">${esc(cut(S.title,W<520?30:62))}</text>`;
  let body=isPie()?rPie(T):S.type==='radar'?rRadar(T):rCart(T);
  svg.classList.toggle('enter',!!animate);
  svg.innerHTML=title+body+lg.html;
}

function empty(T,msg){return `<text x="${W/2}" y="${H/2}" text-anchor="middle" font-size="15" fill="${T.muted}">${msg}</text>`}

function rCart(T){
  const t=S.type,vs=visS(),n=S.labels.length,m=vs.length;
  if(!n||!m){lastSc=null;return empty(T,'Brak danych do wyświetlenia')}
  const sc=frozen||scaleFor(vs);lastSc=sc;
  const Y=v=>P.t+ph-(v-sc.min)/(sc.max-sc.min)*ph;
  const pw=W-P.l-P.r,band=pw/n,cx=i=>P.l+band*(i+.5);
  let defs='',out='';
  vs.forEach(({s,i})=>{
    defs+=`<linearGradient id="g${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.color}"/><stop offset="1" stop-color="${s.color}" stop-opacity=".62"/></linearGradient>
           <linearGradient id="a${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.color}" stop-opacity=".5"/><stop offset="1" stop-color="${s.color}" stop-opacity=".03"/></linearGradient>`;
  });
  const steps=Math.round((sc.max-sc.min)/sc.step);
  for(let k=0;k<=steps;k++){
    const v=+(sc.min+k*sc.step).toFixed(10),y=Y(v);
    if(S.opts.grid)out+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y}" y2="${y}" stroke="${T.grid}" ${v===0?'':'stroke-dasharray="3 5"'} stroke-width="${v===0?1.5:1}"/>`;
    out+=`<text x="${P.l-10}" y="${y+4}" text-anchor="end" font-size="12" fill="${T.muted}">${fmt(v)}</text>`;
  }
  const maxc=Math.max(3,Math.floor(band/7));
  S.labels.forEach((l,i)=>out+=`<text x="${cx(i)}" y="${P.t+ph+22}" text-anchor="middle" font-size="12.5" fill="${T.muted}">${esc(cut(l,maxc))}</text>`);
  const tip=(i,s,v)=>esc(`${S.labels[i]} · ${s.name}: ${fmt(v)}`);
  const lab=(x,y,v,col,anchor='middle')=>S.opts.values?`<text x="${x}" y="${y}" text-anchor="${anchor}" font-size="12" font-weight="600" fill="${col||T.text}">${fmt(v)}</text>`:'';

  if(t==='bar'){
    const gw=Math.min(band*.74,m*70),bw=gw/m,gap=m>1?4:0;
    vs.forEach(({s,i:si},k)=>S.labels.forEach((_,i)=>{
      const v=s.values[i]||0,x=cx(i)-gw/2+k*bw+gap/2,y0=Y(0),y1=Y(v),top=Math.min(y0,y1),h=Math.max(Math.abs(y0-y1),1);
      out+=`<rect class="bar" style="--k:${i}" data-drag="bar" data-s="${si}" data-i="${i}" data-key="b${si}-${i}" data-tip="${tip(i,s,v)}" x="${x}" y="${top}" width="${Math.max(bw-gap,2)}" height="${h}" rx="${Math.min(7,(bw-gap)/2)}" fill="url(#g${si})"/>`;
      if(bw>=22||m===1)out+=lab(x+(bw-gap)/2,v>=0?top-7:top+h+15,v);
    }));
  }else if(t==='stacked'){
    const bw=Math.min(band*.6,90);
    S.labels.forEach((_,i)=>{
      let base=0;
      vs.forEach(({s,i:si})=>{
        const v=Math.max(0,s.values[i]||0),yT=Y(base+v),yB=Y(base),h=Math.max(yB-yT,0);
        out+=`<rect class="bar" style="--k:${i}" data-drag="seg" data-s="${si}" data-i="${i}" data-key="k${si}-${i}" data-tip="${tip(i,s,v)}" x="${cx(i)-bw/2}" y="${yT}" width="${bw}" height="${h}" rx="6" fill="url(#g${si})" stroke="${T.edge}" stroke-width="1.5"/>`;
        if(h>18)out+=`<text x="${cx(i)}" y="${yT+h/2+4}" text-anchor="middle" font-size="12" font-weight="600" fill="#fff" pointer-events="none" style="display:${S.opts.values?'block':'none'}">${fmt(v)}</text>`;
        base+=v;
      });
      out+=lab(cx(i),Y(base)-7,base);
    });
  }else{
    const area=t==='area',pts=s=>s.values.map((v,i)=>[+cx(i).toFixed(1),+Y(v||0).toFixed(1)]);
    const mk=p=>S.opts.smooth?pathMono(p):pathLine(p);
    if(area)vs.forEach(({s,i:si})=>{
      const p=pts(s);if(p.length<2)return;
      out+=`<path class="fade" d="${mk(p)}L${p[p.length-1][0]},${Y(0)}L${p[0][0]},${Y(0)}Z" fill="url(#a${si})"/>`;
    });
    vs.forEach(({s})=>{const p=pts(s);out+=`<path class="draw" pathLength="1" d="${mk(p)}" fill="none" stroke="${s.color}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>`});
    vs.forEach(({s,i:si})=>S.labels.forEach((_,i)=>{
      const v=s.values[i]||0,x=cx(i),y=Y(v);
      out+=`<g class="fade" style="--k:${i}"><circle class="hitc" data-drag="pt" data-s="${si}" data-i="${i}" data-key="p${si}-${i}" data-tip="${tip(i,s,v)}" cx="${x}" cy="${y}" r="17" fill="transparent"/>
        <circle class="pt" cx="${x}" cy="${y}" r="5.5" fill="${s.color}" stroke="#fff" stroke-width="2.5" pointer-events="none"/></g>`;
      out+=lab(x,y-13,v);
    }));
  }
  return `<defs>${defs}</defs>`+out;
}

function pieVis(){
  const s=S.series[0];
  const a=S.labels.map((l,i)=>({i,l,v:Math.max(0,+s.values[i]||0),c:S.catColors[i]})).filter(d=>!S.hiddenC.includes(d.i));
  const total=a.reduce((x,d)=>x+d.v,0);let ang=-Math.PI/2;
  a.forEach(d=>{d.a0=ang;d.sw=total?d.v/total*2*Math.PI:0;ang+=d.sw;d.a1=ang});
  return {a,total};
}
function rPie(T){
  const {a,total}=pieVis();
  if(!total)return empty(T,'Wprowadź wartości większe od zera');
  const donut=S.type==='donut',vals=S.opts.values;
  const availH=H-P.t-P.b,R=Math.max(40,Math.min((W-2*(vals?(W<520?78:120):24))/2,availH/2-(vals?14:4)));
  const cx=W/2,cy=P.t+availH/2,ri=donut?R*.58:0;
  geo={cx,cy,R};
  const pt=(r,an)=>[+(cx+r*Math.cos(an)).toFixed(2),+(cy+r*Math.sin(an)).toFixed(2)];
  let out='',hs='';
  a.forEach((d,k)=>{
    const mid=(d.a0+d.a1)/2,big=d.sw>Math.PI?1:0,pct=d.v/total*100;
    let path;
    if(d.sw>=2*Math.PI-1e-4){
      path=`M${cx-R},${cy}A${R},${R} 0 1 1 ${cx+R},${cy}A${R},${R} 0 1 1 ${cx-R},${cy}Z`+(donut?`M${cx-ri},${cy}A${ri},${ri} 0 1 0 ${cx+ri},${cy}A${ri},${ri} 0 1 0 ${cx-ri},${cy}Z`:'');
    }else{
      const p1=pt(R,d.a0),p2=pt(R,d.a1);
      path=`M${p1}A${R},${R} 0 ${big} 1 ${p2}`+(donut?`L${pt(ri,d.a1)}A${ri},${ri} 0 ${big} 0 ${pt(ri,d.a0)}Z`:`L${cx},${cy}Z`);
    }
    out+=`<g class="slice" style="--k:${k};--dx:${(Math.cos(mid)*9).toFixed(1)}px;--dy:${(Math.sin(mid)*9).toFixed(1)}px" data-tip="${esc(`${d.l}: ${fmt(d.v)} (${nf.format(pct)}%)`)}">
      <path d="${path}" fill="${d.c}" fill-rule="evenodd" stroke="${T.edge}" stroke-width="2.5" stroke-linejoin="round"/></g>`;
    if(vals){
      const lp=pt(R+20,mid),right=Math.cos(mid)>=0;
      out+=`<g class="fade" style="--k:${k}" pointer-events="none"><text x="${lp[0]}" y="${lp[1]-2}" text-anchor="${Math.abs(Math.cos(mid))<.15?'middle':right?'start':'end'}" font-size="12" fill="${T.muted}">${esc(cut(d.l,16))}</text>
        <text x="${lp[0]}" y="${lp[1]+14}" text-anchor="${Math.abs(Math.cos(mid))<.15?'middle':right?'start':'end'}" font-size="13" font-weight="700" fill="${T.text}">${fmt(d.v)} · ${nf.format(+pct.toFixed(1))}%</text></g>`;
    }
    if(k<a.length-1){
      const hp=pt(donut?(R+ri)/2:R*.92,d.a1),n=a[k+1];
      hs+=`<g class="hnd" data-drag="pie" data-s="0" data-i="${k}" data-key="h${k}" data-tip="${esc(`${d.l}: ${fmt(d.v)} ⇄ ${n.l}: ${fmt(n.v)}`)}">
        <circle cx="${hp[0]}" cy="${hp[1]}" r="18" fill="transparent"/><circle cx="${hp[0]}" cy="${hp[1]}" r="9" fill="#fff" stroke="${d.c}" stroke-width="3" style="filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))"/></g>`;
    }
  });
  if(donut)out+=`<g pointer-events="none"><text x="${cx}" y="${cy+2}" text-anchor="middle" font-size="${Math.max(18,R*.2)}" font-weight="700" fill="${T.text}">${fmt(total)}</text>
    <text x="${cx}" y="${cy+Math.max(18,R*.2)*.9}" text-anchor="middle" font-size="12.5" fill="${T.muted}">Razem</text></g>`;
  return out+hs;
}

function rRadar(T){
  const vs=visS(),n=S.labels.length;
  if(n<3)return empty(T,'Wykres radarowy wymaga co najmniej 3 kategorii');
  if(!vs.length)return empty(T,'Brak danych do wyświetlenia');
  let hi=0;vs.forEach(o=>o.s.values.forEach(v=>hi=Math.max(hi,v||0)));
  const sc=frozen||nice(0,hi>0?hi*1.05:1);lastSc=sc;
  const availH=H-P.t-P.b,R=Math.max(40,Math.min((W-2*90)/2,availH/2-26)),cx=W/2,cy=P.t+availH/2;
  geo={cx,cy,R};
  const ang=i=>-Math.PI/2+2*Math.PI*i/n,pt=(r,a)=>[+(cx+r*Math.cos(a)).toFixed(1),+(cy+r*Math.sin(a)).toFixed(1)];
  let out='';
  for(let k=1;k<=5;k++){
    const r=R*k/5;out+=`<polygon points="${S.labels.map((_,i)=>pt(r,ang(i)).join(',')).join(' ')}" fill="none" stroke="${T.grid}" stroke-width="1"/>`;
    if(S.opts.grid||true)out+=`<text x="${cx+4}" y="${cy-r+12}" font-size="10.5" fill="${T.muted}">${fmt(sc.max*k/5)}</text>`;
  }
  S.labels.forEach((l,i)=>{
    const a=ang(i),e=pt(R,a),lp=pt(R+18,a),c=Math.cos(a);
    out+=`<line x1="${cx}" y1="${cy}" x2="${e[0]}" y2="${e[1]}" stroke="${T.grid}"/>
      <text x="${lp[0]}" y="${lp[1]+4}" text-anchor="${Math.abs(c)<.2?'middle':c>0?'start':'end'}" font-size="12.5" fill="${T.muted}">${esc(cut(l,14))}</text>`;
  });
  vs.forEach(({s,i:si})=>{
    const p=S.labels.map((_,i)=>pt(R*clamp((s.values[i]||0)/sc.max,0,1),ang(i)));
    out+=`<polygon class="fade" points="${p.map(q=>q.join(',')).join(' ')}" fill="${s.color}" fill-opacity=".22" stroke="${s.color}" stroke-width="3" stroke-linejoin="round"/>`;
    p.forEach((q,i)=>{
      const v=s.values[i]||0;
      out+=`<g class="fade"><circle class="hitc" data-drag="rad" data-s="${si}" data-i="${i}" data-key="r${si}-${i}" data-tip="${esc(`${S.labels[i]} · ${s.name}: ${fmt(v)}`)}" cx="${q[0]}" cy="${q[1]}" r="16" fill="transparent"/>
        <circle class="pt" cx="${q[0]}" cy="${q[1]}" r="5" fill="${s.color}" stroke="#fff" stroke-width="2.5" pointer-events="none"/></g>`;
    });
  });
  return out;
}

/* ---------- przeciąganie ---------- */
function toSvg(e){
  const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}
function setVal(s,i,v,lo,hi,step){
  const snap=10**Math.floor(Math.log10(Math.max(step,1e-9)/20));
  v=clamp(v,lo,hi);S.series[s].values[i]=+(Math.round(v/snap)*snap).toFixed(8)||0;
}
function applyDrag(p){
  const {kind,s,i}=drag,sc=frozen;
  if(kind==='bar'||kind==='pt'){
    setVal(s,i,sc.min+(P.t+ph-p.y)/ph*(sc.max-sc.min),sc.min,sc.max,sc.step);
  }else if(kind==='seg'){
    let base=0;visS().forEach(o=>{if(o.i<s)base+=Math.max(0,o.s.values[i]||0)});
    setVal(s,i,sc.min+(P.t+ph-p.y)/ph*(sc.max-sc.min)-base,0,sc.max-base,sc.step);
  }else if(kind==='rad'){
    setVal(s,i,Math.hypot(p.x-geo.cx,p.y-geo.cy)/geo.R*sc.max,0,sc.max,sc.step);
  }else if(kind==='pie'){
    const a=drag.pie,A=a[i],B=a[i+1],T2=A.v+B.v;
    const span=(A.sw+B.sw)||1e-9,TAU=2*Math.PI;
    let rel=((Math.atan2(p.y-geo.cy,p.x-geo.cx)-A.a0)%TAU+TAU)%TAU;
    if(rel>span)rel=rel>span+(TAU-span)/2?0:span;
    const snap=10**Math.floor(Math.log10(Math.max(drag.total,1e-9)/200));
    const v=clamp(Math.round(rel/span*T2/snap)*snap,0,T2);
    S.series[0].values[A.i]=+v.toFixed(8);S.series[0].values[B.i]=+(T2-v).toFixed(8);
  }
}
svg.addEventListener('pointerdown',e=>{
  const el=e.target.closest('[data-drag]');if(!el)return;
  e.preventDefault();
  drag={kind:el.dataset.drag,s:+el.dataset.s,i:+el.dataset.i,key:el.dataset.key};
  if(drag.kind==='pie'){const pv=pieVis();drag.pie=pv.a;drag.total=pv.total}
  else frozen=lastSc;
  svg.setPointerCapture(e.pointerId);document.body.classList.add('dragging');
});
svg.addEventListener('pointermove',e=>{
  if(drag){
    applyDrag(toSvg(e));render();syncTable();
    const el=svg.querySelector(`[data-key="${drag.key}"]`);
    if(drag.kind==='pie'){
      // zachowaj stały zestaw par – stan startowy liczy się od nowa po każdym ruchu
      const pv=pieVis();drag.pie=pv.a;drag.total=pv.total;
    }
    showTip(e,el?el.dataset.tip:'');return;
  }
  const t=e.target.closest('[data-tip]');t?showTip(e,t.dataset.tip):hideTip();
});
function endDrag(){
  if(!drag)return;drag=null;frozen=null;document.body.classList.remove('dragging');
  hideTip();render();commit();
}
svg.addEventListener('pointerup',endDrag);svg.addEventListener('pointercancel',endDrag);
svg.addEventListener('pointerleave',()=>{if(!drag)hideTip()});
svg.addEventListener('click',e=>{
  const g=e.target.closest('[data-lg]');if(!g)return;
  const arr=g.dataset.lg==='c'?S.hiddenC:S.hiddenS,i=+g.dataset.i,k=arr.indexOf(i);
  k<0?arr.push(i):arr.splice(k,1);render();commit();
});
function showTip(e,txt){
  if(!txt)return hideTip();
  tip.textContent=txt;tip.classList.add('on');
  const r=$('#stage').getBoundingClientRect();
  tip.style.left=clamp(e.clientX-r.left+14,0,r.width-tip.offsetWidth)+'px';
  tip.style.top=Math.max(0,e.clientY-r.top-42)+'px';
}
function hideTip(){tip.classList.remove('on')}

/* ---------- tabela danych ---------- */
function renderTable(){
  const pie=isPie(),cols=pie?[0]:S.series.map((_,i)=>i);
  let h=`<table><thead><tr><th>Kategoria</th>`;
  cols.forEach(si=>{
    const s=S.series[si];
    h+=`<th><div class="sh">${pie?'':`<input type="color" data-k="scolor" data-s="${si}" value="${s.color}" aria-label="Kolor serii">`}
      <input class="field" data-k="sname" data-s="${si}" value="${esc(s.name)}" aria-label="Nazwa serii">
      ${!pie&&S.series.length>1?`<button class="x" data-act="delser" data-s="${si}" title="Usuń serię" aria-label="Usuń serię">×</button>`:''}</div></th>`;
  });
  h+=`<th></th></tr></thead><tbody>`;
  S.labels.forEach((l,i)=>{
    h+=`<tr><td><div class="lb">${pie?`<input type="color" data-k="ccolor" data-i="${i}" value="${S.catColors[i]}" aria-label="Kolor">`:''}
      <input class="field" data-k="label" data-i="${i}" value="${esc(l)}" aria-label="Kategoria"></div></td>`;
    cols.forEach(si=>h+=`<td><input class="field" type="number" step="any" inputmode="decimal" data-k="val" data-s="${si}" data-i="${i}" value="${S.series[si].values[i]??0}" aria-label="Wartość"></td>`);
    h+=`<td>${S.labels.length>1?`<button class="x" data-act="delrow" data-i="${i}" title="Usuń wiersz" aria-label="Usuń wiersz">×</button>`:''}</td></tr>`;
  });
  $('#tbl').innerHTML=h+'</tbody></table>';
  $('#addSer').style.display=pie?'none':'';
}
function syncTable(){
  document.querySelectorAll('#tbl [data-k=val]').forEach(inp=>{
    if(document.activeElement!==inp)inp.value=S.series[+inp.dataset.s].values[+inp.dataset.i]??0;
  });
}
const tbl=$('#tbl');
tbl.addEventListener('input',e=>{
  const d=e.target.dataset,i=+d.i,s=+d.s;
  if(d.k==='val')S.series[s].values[i]=parseFloat(e.target.value)||0;
  else if(d.k==='label')S.labels[i]=e.target.value;
  else if(d.k==='sname')S.series[s].name=e.target.value;
  else if(d.k==='scolor')S.series[s].color=e.target.value;
  else if(d.k==='ccolor')S.catColors[i]=e.target.value;
  else return;
  render();
});
tbl.addEventListener('change',()=>commit());
tbl.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const i=+b.dataset.i,s=+b.dataset.s;
  if(b.dataset.act==='delrow'){
    S.labels.splice(i,1);S.catColors.splice(i,1);S.series.forEach(x=>x.values.splice(i,1));
    S.hiddenC=S.hiddenC.filter(x=>x!==i).map(x=>x>i?x-1:x);
  }else{
    S.series.splice(s,1);S.hiddenS=S.hiddenS.filter(x=>x!==s).map(x=>x>s?x-1:x);
  }
  renderTable();render();commit();
});
function typical(){
  let a=[];S.series.forEach(s=>s.values.forEach(v=>{if(v>0)a.push(v)}));
  return a.length?a.reduce((x,y)=>x+y,0)/a.length:50;
}
$('#addRow').onclick=()=>{
  const n=S.labels.length,avg=typical();
  S.labels.push('Kategoria '+(n+1));S.catColors.push(PAL[n%PAL.length]);
  S.series.forEach(s=>s.values.push(+(avg*(.5+Math.random())).toFixed(1)));
  renderTable();render(false);commit();
  const w=$('#tbl');w.scrollTop=w.scrollHeight;
};
$('#addSer').onclick=()=>{
  const n=S.series.length,avg=typical();
  S.series.push({name:'Seria '+(n+1),color:PAL[n%PAL.length],values:S.labels.map(()=>+(avg*(.5+Math.random())).toFixed(1))});
  renderTable();render();commit();
};
$('#rand').onclick=()=>{
  let mx=0;S.series.forEach(s=>s.values.forEach(v=>mx=Math.max(mx,Math.abs(v))));mx=mx||100;
  const neg=S.series.some(s=>s.values.some(v=>v<0));
  S.series.forEach(s=>s.values=s.values.map(()=>+((neg?Math.random()*2-.8:.15+Math.random()*.85)*mx).toFixed(1)));
  renderTable();render(true);commit();
};
$('#title').addEventListener('input',e=>{S.title=e.target.value;render()});
$('#title').addEventListener('change',commit);
document.querySelectorAll('[data-opt]').forEach(c=>c.addEventListener('change',()=>{S.opts[c.dataset.opt]=c.checked;render();commit()}));

/* ---------- typ wykresu ---------- */
const seg=$('#seg'),thumb=$('#thumb');
TYPES.forEach(t=>{
  const b=document.createElement('button');b.dataset.t=t.id;
  b.innerHTML=`<svg class="i" viewBox="0 0 24 24">${t.ic}</svg><span>${t.name}</span>`;
  b.onclick=()=>{
    const wasPie=isPie();S.type=t.id;
    if(isPie()!==wasPie)renderTable();
    syncSeg();render(true);commit();
  };
  seg.appendChild(b);
});
function syncSeg(){
  seg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.t===S.type));
  const on=seg.querySelector('button.on');
  if(on){thumb.style.width=on.offsetWidth+'px';thumb.style.transform=`translateX(${on.offsetLeft}px)`;
    const sc=seg.parentElement,l=on.offsetLeft-sc.clientWidth/2+on.offsetWidth/2;sc.scrollTo({left:l,behavior:'smooth'})}
}
const pr=$('#presets');
Object.keys(PRESETS).forEach(k=>{
  const b=document.createElement('button');b.className='chip';b.textContent=k;
  b.onclick=()=>{S=mkState(PRESETS[k]);fullRefresh(true);commit()};
  pr.appendChild(b);
});

/* ---------- historia i zapis ---------- */
let hist=[],hi=-1;const KEY='wykresy-v1';
function commit(){
  const snap=JSON.stringify(S);
  if(hist[hi]===snap)return;
  hist=hist.slice(0,hi+1);hist.push(snap);if(hist.length>100)hist.shift();hi=hist.length-1;
  try{localStorage.setItem(KEY,snap)}catch(_){}
  updUndo();
}
function updUndo(){$('#undo').disabled=hi<=0;$('#redo').disabled=hi>=hist.length-1}
function goto(k){
  if(k<0||k>=hist.length)return;hi=k;S=JSON.parse(hist[hi]);
  try{localStorage.setItem(KEY,hist[hi])}catch(_){}
  fullRefresh(false);updUndo();
}
$('#undo').onclick=()=>goto(hi-1);$('#redo').onclick=()=>goto(hi+1);
addEventListener('keydown',e=>{
  if(!(e.ctrlKey||e.metaKey)||e.key.toLowerCase()!=='z')return;
  if(/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)&&document.activeElement.type!=='color')return;
  e.preventDefault();goto(e.shiftKey?hi+1:hi-1);
});
function fullRefresh(animate){
  $('#title').value=S.title;
  document.querySelectorAll('[data-opt]').forEach(c=>c.checked=!!S.opts[c.dataset.opt]);
  renderTable();syncSeg();render(animate);
}

/* ---------- motyw ---------- */
function setTheme(t){
  document.documentElement.dataset.theme=t;
  document.querySelector('meta[name=theme-color]').content=t==='dark'?'#0b0c15':'#eef1fb';
  $('#theme').innerHTML=t==='dark'
    ?'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
    :'<svg class="i" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  try{localStorage.setItem(KEY+'-theme',t)}catch(_){}
  if(S)render();
}
$('#theme').onclick=()=>setTheme(isDark()?'light':'dark');

/* ---------- eksport ---------- */
function svgString(){
  const T=theme(),c=svg.cloneNode(true);
  c.querySelectorAll('.hnd,.hitc').forEach(n=>n.remove());
  c.removeAttribute('class');c.removeAttribute('id');
  c.setAttribute('xmlns','http://www.w3.org/2000/svg');c.setAttribute('width',W);c.setAttribute('height',H);
  c.setAttribute('font-family',FONT);
  c.insertAdjacentHTML('afterbegin',`<rect width="${W}" height="${H}" fill="${T.bg}"/>`);
  return new XMLSerializer().serializeToString(c);
}
function save(blob,name){
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
const fname=()=>(S.title||'wykres').toLowerCase().replace(/[^a-z0-9ąćęłńóśźż]+/gi,'-').replace(/^-|-$/g,'')||'wykres';
$('#svgx').onclick=()=>save(new Blob([svgString()],{type:'image/svg+xml'}),fname()+'.svg');
$('#png').onclick=()=>{
  const img=new Image();
  img.onload=()=>{
    const k=2,cv=document.createElement('canvas');cv.width=W*k;cv.height=H*k;
    const x=cv.getContext('2d');x.scale(k,k);x.drawImage(img,0,0,W,H);
    cv.toBlob(b=>save(b,fname()+'.png'),'image/png');
  };
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svgString());
};

/* ---------- efekt szkła pod kursorem ---------- */
addEventListener('pointermove',e=>{
  document.querySelectorAll('.glass').forEach(g=>{
    const r=g.getBoundingClientRect();
    g.style.setProperty('--mx',(e.clientX-r.left)+'px');g.style.setProperty('--my',(e.clientY-r.top)+'px');
  });
},{passive:true});

/* ---------- start ---------- */
(function init(){
  let th;try{th=localStorage.getItem(KEY+'-theme')}catch(_){}
  document.documentElement.dataset.theme=th||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  try{const raw=localStorage.getItem(KEY);if(raw)S=JSON.parse(raw)}catch(_){}
  if(!S||!Array.isArray(S.labels)||!Array.isArray(S.series))S=mkState(PRESETS['Sprzedaż']);
  setTheme(document.documentElement.dataset.theme);
  fullRefresh(true);
  hist=[JSON.stringify(S)];hi=0;updUndo();
  let rt;new ResizeObserver(()=>{if(drag)return;clearTimeout(rt);rt=setTimeout(()=>{render();syncSeg()},40)}).observe($('#stage'));
})();
</script>
</body>
</html>
